# Spec: 001-boundaries-and-authority owns this manifest.
[workspace]
resolver = "3"
members = [
  "crates/wire-witness-core",
  "crates/wire-witness-proxy",
  "crates/wire-witness-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/statecrafting/wire-witness"

[workspace.dependencies]
action-gate-core = { version = "=0.2.0", default-features = false }
brotli-decompressor = { version = "5", default-features = false, features = ["std"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
sha2 = { version = "0.10", default-features = false }
time = { version = "0.3", default-features = false, features = ["std"] }
wire-witness-core = { path = "crates/wire-witness-core" }
wire-witness-proxy = { path = "crates/wire-witness-proxy" }
zeroize = { version = "1.9.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
